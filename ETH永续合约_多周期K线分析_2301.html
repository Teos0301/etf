}

function setupDPR(){
  const dpr = window.devicePixelRatio||1;

function fmtTime(ts){

  if (tf==='1d'||tf==='4h') return (d.getMonth()+1)+'-'+p(d.getDate());
  if (tf==='1h') return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':00';
  return p(d.getHours())+':'+p(d.getMinutes());
}
function nice(v){ return v>=1000? v.toFixed(2) : v.toFixed(2); }

  /* 关键位 + 枢轴 */
  const marks = D.levels.map(l=>({p:l.price,t:l.type,c:l.type==='阻力'?'#ef5350':'#26a69a'}));
  [['P','#b388ff'],['R1','#ef9a9a'],['S1','#80cbc4']].forEach(([k,c])=>{ if(D.pivots[k]) marks.push({p:D.pivots[k],t:k,c:c}); });
  marks.forEach(mk=>{
    if(mk.p<lo||mk.p>hi) return;
    const y=yFor(mk.p,lo,hi,PADT,L.mainH);
    ctx.setLineDash([6,4]); ctx.strokeStyle=mk.c+'aa'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PADL,y); ctx.lineTo(L.W-PADR,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=mk.c; ctx.fillText(mk.t+' '+mk.p.toFixed(2), PADL+6, y-3);
  });

  /* 最新价 */
  const lastC = d.k[d.k.length-1][4];
  const yl = yFor(lastC,lo,hi,PADT,L.mainH);
  if(yl>PADT && yl<PADT+L.mainH){
    ctx.setLineDash([2,3]); ctx.strokeStyle=lastC>=d.k[d.k.length-1][1]?'#26a69a':'#ef5350';
    ctx.beginPath(); ctx.moveTo(PADL,yl); ctx.lineTo(L.W-PADR,yl); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = lastC>=d.k[d.k.length-1][1]?'#26a69a':'#ef5350';
    ctx.fillRect(L.W-PADR+2, yl-8, 60, 16);
    ctx.fillStyle='#fff'; ctx.fillText(lastC.toFixed(2), L.W-PADR+8, yl+3.5);
  }

  /* ------- VOL ------- */
  const vT=PADT+352, vH=56;
  let vMax=0; for(const r of ks) if(r[5]>vMax)vMax=r[5];
  for(let i=0;i<ks.length;i++){
    const r=ks[i], up=r[4]>=r[1];
    const h=vMax? r[5]/vMax*vH:0;
    ctx.fillStyle=up?'rgba(38,166,154,.65)':'rgba(239,83,80,.65)';
    ctx.fillRect(xi(start+i)-bw/2, vT+vH-h, bw, Math.max(1,h));
  }
  ctx.fillStyle='#8b94a7'; ctx.fillText('VOL ' + (ks[ks.length-1][5]*0.01).toFixed(1)+' ETH', PADL+4, vT-2);

  /* ------- MACD ------- */
  const mT=PADT+424, mH=78;
  let mLo=0,mHi=0;
  for(let i=start;i<Math.min(start+count,d.k.length);i++){
    ['dif','dea','hist'].forEach(k=>{ const v=d[k][i]; if(v==null)return; if(v<mLo)mLo=v; if(v>mHi)mHi=v; });
  }
  const mp=Math.max(Math.abs(mLo),Math.abs(mHi))||1;
  const myFor=v=> mT + mH/2 - v/mp*(mH/2*0.92);
  ctx.strokeStyle='#1a2130'; ctx.beginPath(); ctx.moveTo(PADL,myFor(0)); ctx.lineTo(L.W-PADR,myFor(0)); ctx.stroke();
  for(let i=0;i<count;i++){
    const v=d.hist[start+i]; if(v==null)continue;
    ctx.fillStyle=v>=0?'#26a69a':'#ef5350';
    const y0=myFor(0), y1=myFor(v);
    ctx.fillRect(xi(start+i)-bw/2, Math.min(y0,y1), bw, Math.max(1,Math.abs(y1-y0)));
  }
  [['#5b8def','dif'],['#f0b90b','dea']].forEach(([c,k])=>{
    ctx.beginPath(); let f=true;
    d[k].slice(start,start+count).forEach((v,i)=>{ if(v==null)return;
      f?ctx.moveTo(xi(start+i),myFor(v)):ctx.lineTo(xi(start+i),myFor(v)); f=false; });
    ctx.strokeStyle=c; ctx.lineWidth=1.1; ctx.stroke();
  });
  ctx.fillStyle='#8b94a7';
  ctx.fillText('MACD(12,26,9)  DIF:'+(d.dif[start+count-1]||0).toFixed(2)+'  DEA:'+(d.dea[start+count-1]||0).toFixed(2), PADL+4, mT-2);

  /* ------- RSI ------- */
  const rT=PADT+516, rH=58;
  const ryFor=v=> rT + rH - v/100*rH;
  [30,50,70].forEach(v=>{
    ctx.strokeStyle=v===50?'#1a2130':'#242c3d'; ctx.setLineDash(v===50?[]:[3,3]);
    ctx.beginPath(); ctx.moveTo(PADL,ryFor(v)); ctx.lineTo(L.W-PADR,ryFor(v)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#5c667e'; ctx.fillText(v, L.W-PADR+6, ryFor(v)+3);
  });
  ctx.beginPath(); let rf=true;
  d.rsi.slice(start,start+count).forEach((v,i)=>{ if(v==null)return;
    rf?ctx.moveTo(xi(start+i),ryFor(v)):ctx.lineTo(xi(start+i),ryFor(v)); rf=false; });
  ctx.strokeStyle='#e6a23c'; ctx.lineWidth=1.3; ctx.stroke();
  ctx.fillStyle='#8b94a7';
  ctx.fillText('RSI(14) = '+(d.rsi[start+count-1]!=null?d.rsi[start+count-1].toFixed(1):'--'), PADL+4, rT-2);

  /* ------- 十字光标 ------- */
  if(mouse && mouse.x>PADL && mouse.x<L.W-PADR){
    const idx = Math.max(0, Math.min(d.k.length-1, start + Math.floor((mouse.x-PADL)/slot)));
    const x = xi(idx);
    ctx.strokeStyle='#5c667e'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,PADT); ctx.lineTo(x,rT+rH); ctx.stroke();
    if(mouse.y>PADT && mouse.y<PADT+L.mainH){
      ctx.beginPath(); ctx.moveTo(PADL,mouse.y); ctx.lineTo(L.W-PADR,mouse.y); ctx.stroke();
      const pv2 = hi-(mouse.y-PADT)/L.mainH*(hi-lo);
      ctx.setLineDash([]);
      ctx.fillStyle='#2a3245'; ctx.fillRect(L.W-PADR+2, mouse.y-8, 60, 16);
      ctx.fillStyle='#fff'; ctx.fillText(nice(pv2), L.W-PADR+8, mouse.y+3.5);
    }
    ctx.setLineDash([]);
    showTip(idx, d);
  }
}

function showTip(i, d){
  const r = d.k[i];
  const chg = (r[4]/r[1]-1)*100, up = r[4]>=r[1];
  const t = new Date(r[0]);
  const p = n=>(n<10?'0':'')+n;
  const dt = (t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());
  const row = (k,v)=>'<div style="display:flex;justify-content:space-between;gap:18px"><span style="color:#8b94a7">'+k+'</span><span>'+v+'</span></div>';
  tipEl.innerHTML = '<b style="color:#fff">'+dt+' ('+D.tfLabel[tf]+')</b>'
    + row('开/高/低', r[1].toFixed(2)+' / '+r[2].toFixed(2)+' / '+r[3].toFixed(2))
    + row('收盘', '<span class="'+(up?'up':'dn')+'">'+r[4].toFixed(2)+' ('+(up?'+':'')+chg.toFixed(2)+'%)</span>')
    + row('成交量', (r[5]*0.01).toFixed(2)+' ETH')
    + row('MA5/20', (d.ma5[i]!=null?d.ma5[i].toFixed(2):'--')+' / '+(d.ma20[i]!=null?d.ma20[i].toFixed(2):'--'))
    + row('MACD', d.hist[i]!=null? d.hist[i].toFixed(2) : '--')
    + row('RSI', d.rsi[i]!=null? d.rsi[i].toFixed(1) : '--');
  tipEl.style.display='block';
  const tx = Math.min(window.innerWidth-240, (mouse?mouse.clientX:100)+16);
  const ty = Math.max(10, (mouse?mouse.clientY:100)-tipEl.offsetHeight-14);
  tipEl.style.left = tx+'px'; tipEl.style.top = ty+'px';
  ohlcEl.innerHTML = 'O <b class="'+(up?'up':'dn')+'">'+r[1].toFixed(2)+'</b>  H <b class="up">'+r[2].toFixed(2)
    +'</b>  L <b class="dn">'+r[3].toFixed(2)+'</b>  C <b class="'+(up?'up':'dn')+'">'+r[4].toFixed(2)
    +'</b>  VOL '+(r[5]*0.01).toFixed(1)+' ETH';
}

/* ---------- 交互 ---------- */
cv.addEventListener('mousemove', e=>{
  const rc = cv.getBoundingClientRect();
  mouse = {x:e.clientX-rc.left, y:e.clientY-rc.top, clientX:e.clientX, clientY:e.clientY};
  draw();
});
cv.addEventListener('mouseleave', ()=>{ mouse=null; tipEl.style.display='none'; draw(); });
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = e.deltaY>0? 1.15:0.87;
  const L = layout(), d = D.data[tf];
  const rel = (mouse? mouse.x-PADL : (L.W-PADL-PADR)/2) / (L.W-PADL-PADR);
  const c0 = view.count;
  view.count = Math.max(30, Math.min(d.k.length, Math.round(c0*f)));
  view.start = Math.max(0, Math.min(d.k.length-view.count,
      Math.round(view.start + rel*(c0-view.count))));
  draw();
},{passive:false});
let drag=null;
cv.addEventListener('mousedown', e=>{ drag={x:e.clientX, s:view.start}; });
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  const L = layout(), slot=(L.W-PADL-PADR)/view.count;
  view.start = Math.max(0, Math.min(D.data[tf].k.length-view.count, drag.s - Math.round((e.clientX-drag.x)/slot)));
  draw();
});
window.addEventListener('mouseup', ()=>{ drag=null; });
cv.addEventListener('dblclick', ()=>{ resetView(); draw(); });
window.addEventListener('resize', draw);

function resetView(){
  const d = D.data[tf];
  view = {start: Math.max(0, d.k.length-140), count: Math.min(140, d.k.length)};
}

/* tabs */
(function(){
  const order = ['1m','5m','15m','1h','4h','1d'];
  const el = document.getElementById('tabs');
  el.innerHTML = order.map(k=>'<div class="tab'+(k===tf?' on':'')+'" data-tf="'+k+'">'+D.tfLabel[k]+'</div>').join('');
  el.addEventListener('click', e=>{
    const t = e.target.closest('.tab'); if(!t) return;
    tf = t.dataset.tf;
    el.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.tf===tf));
    resetView(); draw();
  });
})();

resetView(); draw();
</script>
